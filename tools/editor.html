<!doctype html>
<meta charset="utf-8" />
<title>Box unicorn editor</title>
<!--
  A shaping tool for the box unicorn, and nothing else.

  The unicorn is twelve axis-aligned boxes now, which is a shape you can only
  really judge by looking at it — so this draws them, lets you drag the numbers,
  and prints the two arrays back out in exactly the form src/game.js wants them.
  Nothing here is shipped: it is a build output like sounds.html, generated with
  the *current* values injected so it can never open showing a stale unicorn.

  It is deliberately not the game's renderer. Boxes are axis-aligned and there
  are twelve of them, so a painter's-algorithm fill over projected corners is
  exact — no depth buffer to fight, no WebGPU to set up, and it opens off
  file:// with nothing running.
-->
<style>
  :root {
    --bg: #14101c;
    --panel: #1e1830;
    --line: #342a4e;
    --ink: #f3ecff;
    --dim: #a495c6;
    --hot: #ffd166;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
    display: grid;
    grid-template-columns: 300px 1fr 340px;
    height: 100vh;
    overflow: hidden;
  }
  h2 {
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--dim);
    margin: 18px 0 8px;
    font-weight: 600;
  }
  aside { padding: 14px 16px; overflow-y: auto; border-right: 1px solid var(--line); }
  aside:last-child { border-right: 0; border-left: 1px solid var(--line); }
  main { position: relative; display: grid; place-items: center; min-width: 0; }
  canvas { display: block; cursor: grab; }
  canvas:active { cursor: grabbing; }

  .part {
    display: flex;
    justify-content: space-between;
    padding: 5px 9px;
    border-radius: 5px;
    cursor: pointer;
    border: 1px solid transparent;
  }
  .part:hover { background: var(--panel); }
  .part.on { background: var(--panel); border-color: var(--hot); color: var(--hot); }
  .part i { color: var(--dim); font-style: normal; font-size: 11px; }
  .part.on i { color: var(--hot); }

  .row { display: grid; grid-template-columns: 34px repeat(3, 12px 1fr); gap: 5px; align-items: center; margin-bottom: 7px; }
  .row span { color: var(--dim); font-size: 11px; }
  input[type='number'] {
    width: 100%;
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--ink);
    border-radius: 4px;
    padding: 4px 6px;
    font: inherit;
  }
  input[type='number']:focus { outline: 0; border-color: var(--hot); }
  label.chk { display: flex; gap: 8px; align-items: center; color: var(--dim); margin: 4px 0; cursor: pointer; }

  textarea {
    width: 100%;
    height: 250px;
    background: #0d0a14;
    border: 1px solid var(--line);
    color: #c6f0d0;
    border-radius: 6px;
    padding: 10px;
    font: 11px/1.5 ui-monospace, monospace;
    resize: vertical;
  }
  button {
    background: var(--hot);
    color: #241a05;
    border: 0;
    border-radius: 5px;
    padding: 7px 12px;
    font: inherit;
    font-weight: 700;
    cursor: pointer;
    margin-top: 8px;
  }
  button.ghost { background: var(--panel); color: var(--dim); font-weight: 400; }
  .hint { color: var(--dim); font-size: 11px; line-height: 1.6; }
  #ref { position: absolute; right: 12px; top: 12px; width: 190px; border-radius: 8px; opacity: 0.95; border: 1px solid var(--line); }
  #ref.off { display: none; }
  #hud { position: absolute; left: 12px; bottom: 10px; color: var(--dim); font-size: 11px; }
</style>

<aside>
  <h2>Parts</h2>
  <div id="list"></div>

  <h2>Legs</h2>
  <div class="hint" id="legnote"></div>
  <div id="leglist"></div>
</aside>

<main>
  <canvas id="view"></canvas>
  <img id="ref" src="/*REF*/" alt="reference" onerror="this.classList.add('off')" />
  <div id="hud">drag to turn the model &middot; wheel to zoom &middot; arrows nudge the selected box</div>
</main>

<aside>
  <h2>Selected</h2>
  <div id="fields"></div>

  <h2>View</h2>
  <label class="chk"><input type="checkbox" id="wire" /> edges on every box</label>
  <label class="chk"><input type="checkbox" id="solo" /> hide everything else</label>
  <label class="chk"><input type="checkbox" id="showref" checked /> reference image</label>

  <h2>src/unicorn.js</h2>
  <div class="hint">This is the whole file. Copy replaces it; paste one in and
    hit Load to pick up where it left off.</div>
  <textarea id="out" spellcheck="false"></textarea>
  <div id="parse" class="hint"></div>
  <button id="copy">Copy</button>
  <button id="load" class="ghost">Load</button>
  <button id="reset" class="ghost">Reset</button>
</aside>

<script>
  // ── The model, injected by the build from src/game.js ────────────────────
  /*MODEL*/

  const START = JSON.parse(JSON.stringify({ PARTS, LEGS, BELLY, LEG_HALF, LEG_TOP }));
  let parts = PARTS.map((p) => p.slice());
  let legs = LEGS.map((l) => l.slice());
  let belly = BELLY;
  let legHalf = LEG_HALF;
  let legTop = LEG_TOP;

  // Names are the tool's, not the game's — game.js carries them as comments on
  // each row, and this needs them as labels. Same order, so the indices line up.
  const NAMES = ['barrel', 'neck + head', 'muzzle', 'ear (left)', 'ear (right)', 'horn', 'mane', 'tail'];
  const PAINT = { 1: ['mane', '#e879c8'], 2: ['hide', '#f5d9e6'], 3: ['horn', '#ffcf5c'] };

  let sel = 0;
  let selLeg = -1;

  // ── Rendering ───────────────────────────────────────────────────────────
  // Painter's algorithm over projected corners. Exact for axis-aligned boxes at
  // this count, and it means the whole renderer is one sort and a fill loop.
  const cv = document.getElementById('view');
  const g = cv.getContext('2d');
  let yaw = -0.9, pitch = 0.22, dist = 4.6;

  const FACES = [
    [0, 4, 6, 2, -1, 0, 0],
    [1, 3, 7, 5, 1, 0, 0],
    [0, 1, 5, 4, 0, -1, 0],
    [2, 6, 7, 3, 0, 1, 0],
    [0, 2, 3, 1, 0, 0, -1],
    [4, 5, 7, 6, 0, 0, 1],
  ];
  const cornerOf = (b, k) => [b & 1 ? k[3] : k[0], b & 2 ? k[4] : k[1], b & 4 ? k[5] : k[2]];

  function project(p) {
    // Orbit about a point a little above the ground, so the animal sits in frame
    // rather than the origin under its hooves.
    const x = p[0], y = p[1] - 1.1, z = p[2];
    const cy = Math.cos(yaw), sy = Math.sin(yaw);
    let X = x * cy - z * sy, Z = x * sy + z * cy;
    const cp = Math.cos(pitch), sp = Math.sin(pitch);
    let Y = y * cp - Z * sp;
    Z = y * sp + Z * cp;
    const d = Z + dist;
    const f = (cv.height * 0.5) / Math.max(d, 0.05);
    return [cv.width / 2 + X * f, cv.height / 2 - Y * f, d];
  }

  function boxFaces(k, fill, isSel, out) {
    for (const f of FACES) {
      const c = [0, 1, 2, 3].map((i) => project(cornerOf(f[i], k)));
      // Light from up and to the front-left, the same direction the game lights
      // from, so a face reads here the way it will read there.
      const lam = Math.max(f[4] * 0.4 + f[5] * 0.78 + f[6] * 0.48, 0) * 0.62 + 0.44;
      out.push({ c, lam, fill, isSel, z: (c[0][2] + c[1][2] + c[2][2] + c[3][2]) / 4 });
    }
  }

  const shade = (hex, m) => {
    const n = parseInt(hex.slice(1), 16);
    const v = (s) => Math.min(255, Math.round(((n >> s) & 255) * m));
    return `rgb(${v(16)},${v(8)},${v(0)})`;
  };

  function draw() {
    const w = cv.parentElement.clientWidth, h = cv.parentElement.clientHeight;
    const dpr = devicePixelRatio || 1;
    cv.width = w * dpr; cv.height = h * dpr;
    cv.style.width = w + 'px'; cv.style.height = h + 'px';
    g.fillStyle = '#14101c';
    g.fillRect(0, 0, cv.width, cv.height);

    const solo = document.getElementById('solo').checked;
    const wire = document.getElementById('wire').checked;
    const quads = [];

    // The ground the animal stands on, as a reference for where y = 0 is.
    for (let i = -6; i <= 6; i++) {
      for (const [a, b] of [[[i * 0.25, 0, -1.5], [i * 0.25, 0, 1.5]], [[-1.5, 0, i * 0.25], [1.5, 0, i * 0.25]]]) {
        const p = project(a), q = project(b);
        if (p[2] > 0.1 && q[2] > 0.1) {
          g.strokeStyle = '#241d38';
          g.beginPath(); g.moveTo(p[0], p[1]); g.lineTo(q[0], q[1]); g.stroke();
        }
      }
    }

    parts.forEach((p, i) => {
      if (solo && !(sel === i && selLeg < 0)) return;
      boxFaces(p, PAINT[p[6]][1], sel === i && selLeg < 0, quads);
    });
    legs.forEach((l, i) => {
      if (solo && selLeg !== i) return;
      boxFaces([l[0] - legHalf, 0, l[1] - legHalf, l[0] + legHalf, legTop, l[1] + legHalf],
        PAINT[2][1], selLeg === i, quads);
    });

    quads.sort((a, b) => b.z - a.z);
    for (const q of quads) {
      if (q.c.some((p) => p[2] <= 0.05)) continue;
      g.beginPath();
      g.moveTo(q.c[0][0], q.c[0][1]);
      for (let i = 1; i < 4; i++) g.lineTo(q.c[i][0], q.c[i][1]);
      g.closePath();
      g.fillStyle = shade(q.fill, q.lam);
      g.fill();
      if (q.isSel || wire) {
        g.strokeStyle = q.isSel ? '#ffd166' : 'rgba(0,0,0,.28)';
        g.lineWidth = q.isSel ? 2 : 1;
        g.stroke();
      }
    }
  }

  // ── Panels ──────────────────────────────────────────────────────────────
  function buildList() {
    document.getElementById('list').innerHTML = parts
      .map((p, i) => `<div class="part${sel === i && selLeg < 0 ? ' on' : ''}" data-i="${i}">
        <span>${NAMES[i] || 'part ' + i}</span><i>${PAINT[p[6]][0]}</i></div>`)
      .join('');
    document.getElementById('leglist').innerHTML = legs
      .map((l, i) => `<div class="part${selLeg === i ? ' on' : ''}" data-leg="${i}">
        <span>${l[0] > 0 ? 'front' : 'hind'} ${l[1] > 0 ? 'left' : 'right'}</span>
        <i>${l[0].toFixed(2)}, ${l[1].toFixed(2)}</i></div>`)
      .join('');
    document.getElementById('legnote').textContent =
      'All four share a thickness and a height; each has its own position.';
    for (const el of document.querySelectorAll('[data-i]'))
      el.onclick = () => { sel = +el.dataset.i; selLeg = -1; refresh(); };
    for (const el of document.querySelectorAll('[data-leg]'))
      el.onclick = () => { selLeg = +el.dataset.leg; refresh(); };
  }

  // Centre and size rather than the two corners the array stores. Shaping a box
  // is "make it wider" and "move it forward", and those are one field each this
  // way and two the other — the corners are what gets written out, not what gets
  // edited.
  const F = (id, label, val, step, on) =>
    `<span>${label}</span><input type="number" id="${id}" value="${(+val).toFixed(3)}" step="${step}" />`;

  function buildFields() {
    const box = document.getElementById('fields');
    if (selLeg >= 0) {
      const l = legs[selLeg];
      box.innerHTML =
        `<div class="row"><span>pos</span>${F('lx', 'x', l[0], 0.01)}${F('lz', 'z', l[1], 0.01)}<span></span></div>` +
        `<div class="row"><span>all</span>${F('lh', 'half', legHalf, 0.005)}${F('lt', 'top', legTop, 0.01)}<span></span></div>` +
        `<div class="hint">half is the leg's half-thickness; top is how far up it runs, past the belly at ${belly} so the two never share a face.</div>`;
      const bind = (id, set) => {
        const el = document.getElementById(id);
        el.oninput = () => { set(+el.value); draw(); emit(); };
      };
      bind('lx', (v) => (legs[selLeg][0] = v));
      bind('lz', (v) => (legs[selLeg][1] = v));
      bind('lh', (v) => (legHalf = v));
      bind('lt', (v) => (legTop = v));
      return;
    }
    const p = parts[sel];
    const c = [0, 1, 2].map((a) => (p[a] + p[a + 3]) / 2);
    const s = [0, 1, 2].map((a) => p[a + 3] - p[a]);
    box.innerHTML =
      `<div class="row"><span>at</span>${F('cx', 'x', c[0], 0.01)}${F('cy', 'y', c[1], 0.01)}${F('cz', 'z', c[2], 0.01)}</div>` +
      `<div class="row"><span>size</span>${F('sx', 'w', s[0], 0.01)}${F('sy', 'h', s[1], 0.01)}${F('sz', 'd', s[2], 0.01)}</div>` +
      `<div class="hint">x is nose-to-tail (the unicorn faces +x), y is up, z is across.<br />
       corners: ${p.slice(0, 3).map((n) => n.toFixed(2)).join(', ')} &rarr; ${p.slice(3, 6).map((n) => n.toFixed(2)).join(', ')}</div>`;
    const apply = () => {
      const nc = ['cx', 'cy', 'cz'].map((i) => +document.getElementById(i).value);
      const ns = ['sx', 'sy', 'sz'].map((i) => +document.getElementById(i).value);
      for (let a = 0; a < 3; a++) {
        parts[sel][a] = +(nc[a] - ns[a] / 2).toFixed(4);
        parts[sel][a + 3] = +(nc[a] + ns[a] / 2).toFixed(4);
      }
      draw();
      emit();
    };
    for (const id of ['cx', 'cy', 'cz', 'sx', 'sy', 'sz']) document.getElementById(id).oninput = apply;
  }

  // ── Output, in the exact shape game.js holds it ─────────────────────────
  const n = (v) => String(+v.toFixed(4));

  // **The whole of src/unicorn.js, with only the numerals swapped.** Emitting
  // the two arrays on their own was the earlier version and it was wrong twice
  // over: it dropped the prose written around the rows, and it left the reader
  // to graft two fragments into a file by hand. The file holds nothing but this
  // data now, so the honest output is the file — Copy, then paste over it.
  //
  // Every line is passed through untouched unless it is one this owns: a row,
  // which is a line starting with `[`, or one of the three named scalars. Rows
  // are fed from whichever array was last opened, which is what keeps the part
  // comments attached to the numbers they describe.
  function emit() {
    const scalars = { BELLY: belly, LEG_HALF: legHalf, LEG_TOP: legTop };
    let rows = null;
    let k = 0;
    document.getElementById('out').value = FILE_SRC.split('\n')
      .map((line) => {
        const named = line.match(/^const (\w+) = [\d.]+;/);
        if (named && named[1] in scalars) {
          return line.replace(/= [\d.]+;/, `= ${n(scalars[named[1]])};`);
        }
        if (/^const LEGS = \[/.test(line)) { rows = legs; k = 0; }
        else if (/^const PARTS = \[/.test(line)) { rows = parts; k = 0; }
        if (!/^\s*\[/.test(line) || !rows || k >= rows.length) return line;
        const tail = line.slice(line.indexOf(']') + 1).replace(/^,/, '');
        return `  [${rows[k++].map(n).join(', ')}],${tail}`;
      })
      .join('\n');
  }

  function refresh() { buildList(); buildFields(); draw(); emit(); }

  // ── Input ───────────────────────────────────────────────────────────────
  let drag = null;
  cv.onpointerdown = (e) => { drag = [e.clientX, e.clientY]; cv.setPointerCapture(e.pointerId); };
  cv.onpointerup = () => (drag = null);
  cv.onpointermove = (e) => {
    if (!drag) return;
    yaw += (e.clientX - drag[0]) * 0.008;
    // Negated, so dragging down tips the model's top away from you rather than
    // towards you. The camera orbits *up* when the hand goes down, which is what
    // "grab it and turn it" means and the opposite of what the raw delta gives.
    pitch = Math.max(-1.4, Math.min(1.4, pitch - (e.clientY - drag[1]) * 0.006));
    drag = [e.clientX, e.clientY];
    draw();
  };
  cv.onwheel = (e) => { e.preventDefault(); dist = Math.max(2, Math.min(24, dist * (1 + Math.sign(e.deltaY) * 0.1))); draw(); };

  // Arrows nudge the selected box along the two axes the camera has you looking
  // at, which is what makes this feel like dragging rather than typing.
  addEventListener('keydown', (e) => {
    if (e.target.tagName === 'INPUT') return;
    const step = e.shiftKey ? 0.05 : 0.01;
    const map = { ArrowLeft: [0, -1], ArrowRight: [0, 1], ArrowUp: [1, 1], ArrowDown: [1, -1] };
    const m = map[e.key];
    if (!m) return;
    e.preventDefault();
    if (selLeg >= 0) {
      if (m[0] === 0) legs[selLeg][0] += m[1] * step;
      else legTop += m[1] * step;
    } else {
      parts[sel][m[0]] += m[1] * step;
      parts[sel][m[0] + 3] += m[1] * step;
    }
    buildFields(); draw(); emit();
  });

  for (const id of ['wire', 'solo']) document.getElementById(id).onchange = draw;
  document.getElementById('showref').onchange = (e) =>
    document.getElementById('ref').classList.toggle('off', !e.target.checked);
  document.getElementById('copy').onclick = () => {
    navigator.clipboard.writeText(document.getElementById('out').value);
    const b = document.getElementById('copy');
    b.textContent = 'Copied';
    setTimeout(() => (b.textContent = 'Copy'), 900);
  };
  // Reading the box back in. The same comment-stripping the build does to lift
  // these arrays out of game.js, because what gets pasted here is game.js — and
  // it is forgiving about what it is given: either array on its own is enough,
  // and anything it cannot parse leaves the model alone and says so rather than
  // half-loading it.
  document.getElementById('load').onclick = () => {
    const txt = document.getElementById('out').value;
    const note = document.getElementById('parse');
    const grab = (name) => {
      const at = txt.indexOf(name + ' = [');
      if (at < 0) return null;
      const open = txt.indexOf('[', at);
      const close = txt.indexOf('];', open);
      if (close < 0) return null;
      return JSON.parse(
        txt.slice(open, close + 1).replace(/\/\/[^\n]*/g, '').replace(/,\s*\]/, ']'),
      );
    };
    try {
      const np = grab('PARTS');
      const nl = grab('LEGS');
      if (!np && !nl) throw new Error('no PARTS or LEGS block found');
      if (np) {
        if (!np.every((r) => r.length === 7)) throw new Error('every PARTS row needs 6 numbers and a paint code');
        parts = np;
      }
      if (nl) legs = nl;
      const half = txt.match(/leg\[0\] - ([\d.]+)/);
      const top = txt.match(/leg\[0\] \+ [\d.]+, ([\d.]+)/);
      if (half) legHalf = +half[1];
      if (top) legTop = +top[1];
      sel = Math.min(sel, parts.length - 1);
      note.textContent = `loaded ${np ? np.length + ' parts' : ''}${np && nl ? ', ' : ''}${nl ? nl.length + ' legs' : ''}`;
      refresh();
    } catch (err) {
      note.textContent = 'could not read that: ' + err.message;
    }
  };

  document.getElementById('reset').onclick = () => {
    parts = START.PARTS.map((p) => p.slice());
    legs = START.LEGS.map((l) => l.slice());
    belly = START.BELLY; legHalf = START.LEG_HALF; legTop = START.LEG_TOP;
    refresh();
  };

  addEventListener('resize', draw);
  refresh();
</script>
